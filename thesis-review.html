<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>論文進度審查表 | 115-1 研究方法</title>
<style>
  :root {
    --bg: #FDF8E8;
    --card: #FFFDF2;
    --border: #F2EAD3;
    --accent: #D4A017;
    --accent-light: #F5E6A3;
    --text: #3D2C00;
    --text-light: #6B5A30;
    --green: #2E7D32;
    --green-light: #E8F5E9;
    --yellow: #F57F17;
    --yellow-light: #FFF8E1;
    --red: #C62828;
    --red-light: #FFEBEE;
    --blue: #1565C0;
    --blue-light: #E3F2FD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    line-height: 1.6;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 4px;
    color: var(--text);
  }
  .subtitle {
    text-align: center;
    color: var(--text-light);
    margin-bottom: 20px;
    font-size: 0.95rem;
  }
  .summary-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
  }
  .summary-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .summary-chip .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-all { background: var(--accent); }
  .dot-done { background: var(--green); }
  .dot-partial { background: var(--yellow); }
  .dot-none { background: var(--red); }

  .table-wrap {
    overflow-x: auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    min-width: 900px;
  }
  thead th {
    background: var(--accent);
    color: #fff;
    padding: 10px 6px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 2;
    white-space: nowrap;
    border-right: 1px solid rgba(255,255,255,0.2);
  }
  thead th:first-child { border-radius: 12px 0 0 0; }
  thead th:last-child { border-radius: 0 12px 0 0; border-right: none; }
  thead th.sub {
    font-size: 0.75rem;
    background: #C49000;
    padding: 4px 3px;
  }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover { background: #FFF9E6; }
  tbody tr:nth-child(even) { background: #FFFEF8; }
  tbody tr:nth-child(even):hover { background: #FFF9E6; }
  td {
    padding: 8px 4px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  td.name-cell {
    text-align: left;
    padding-left: 12px;
    white-space: nowrap;
    min-width: 90px;
  }
  td.id-cell {
    color: var(--text-light);
    font-size: 0.75rem;
    white-space: nowrap;
    min-width: 70px;
  }
  td.title-cell {
    text-align: left;
    padding-left: 8px;
    font-size: 0.78rem;
    color: var(--text-light);
    max-width: 280px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  td.method-cell {
    font-size: 0.75rem;
    white-space: nowrap;
    min-width: 44px;
  }
  .method-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .method-個案 { background: #E3F2FD; color: #1565C0; }
  .method-SPSS { background: #F3E5F5; color: #7B1FA2; }
  .method-德爾菲 { background: #E8F5E9; color: #2E7D32; }
  .method-AHP { background: #FFF8E1; color: #E65100; }

  /* Checkbox styling */
  .chk {
    width: 22px; height: 22px;
    cursor: pointer;
    accent-color: var(--accent);
    transform: scale(1.2);
  }
  /* Status badge in last column */
  td.status-cell { font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
  .status-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.72rem;
    font-weight: 700;
  }
  .status-done { background: var(--green-light); color: var(--green); }
  .status-partial { background: var(--yellow-light); color: var(--yellow); }
  .status-none { background: var(--red-light); color: var(--red); }

  .chapter-total {
    background: rgba(255,255,255,0.2) !important;
    font-weight: 700 !important;
    font-size: 0.8rem;
  }
  .col-total {
    background: #C49000 !important;
    font-size: 0.72rem;
    min-width: 36px;
  }

  /* Legend */
  .legend {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 16px;
    font-size: 0.82rem;
    color: var(--text-light);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 8px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--accent-light); border-color: var(--accent); }
  .btn-reset { color: var(--red); }
  .btn-reset:hover { background: var(--red-light); border-color: var(--red); }
  .btn-export { color: var(--blue); }
  .btn-export:hover { background: var(--blue-light); border-color: var(--blue); }

  .filter-bar {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--card);
    cursor: pointer;
    font-size: 0.8rem;
    font-family: inherit;
    color: var(--text-light);
    transition: all 0.15s;
  }
  .filter-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .filter-btn:hover:not(.active) { background: var(--accent-light); }

  .last-saved {
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-light);
    margin-top: 10px;
  }

  @media (max-width: 768px) {
    body { padding: 10px; }
    h1 { font-size: 1.3rem; }
    table { font-size: 0.75rem; }
    .chk { width: 18px; height: 18px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>📋 論文進度審查表</h1>
  <p class="subtitle">115-1 研究方法課程｜19 位同學</p>

  <div class="summary-bar" id="summaryBar"></div>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="個案">個案研究</button>
    <button class="filter-btn" data-filter="SPSS">SPSS 分析</button>
    <button class="filter-btn" data-filter="德爾菲">德爾菲法</button>
    <button class="filter-btn" data-filter="AHP">AHP 層級分析</button>
    <button class="filter-btn" data-filter="pending">未完成</button>
  </div>

  <div class="table-wrap">
    <table id="reviewTable">
      <thead>
        <tr>
          <th rowspan="2" style="min-width:44px">#</th>
          <th rowspan="2" style="min-width:70px">學號</th>
          <th rowspan="2" style="min-width:80px">姓名</th>
          <th rowspan="2" style="min-width:260px">論文題目</th>
          <th rowspan="2" style="min-width:44px">方法</th>
          <th colspan="5">論文章節</th>
          <th colspan="2">報告</th>
          <th rowspan="2" style="min-width:56px">進度</th>
        </tr>
        <tr>
          <th class="sub">第1章</th>
          <th class="sub">第2章</th>
          <th class="sub">第3章</th>
          <th class="sub">第4章</th>
          <th class="sub">第5章</th>
          <th class="sub">期中</th>
          <th class="sub">期末</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
      <tfoot>
        <tr id="footRow" style="background:#FFF8E0;font-weight:700;"></tr>
      </tfoot>
    </table>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="status-badge status-done">✓ 完成</span> 五章＋期中＋期末皆勾</div>
    <div class="legend-item"><span class="status-badge status-partial">◐ 進行中</span> 部分完成</div>
    <div class="legend-item"><span class="status-badge status-none">✗ 未開始</span> 進度 0%</div>
  </div>

  <div class="controls">
    <button class="btn btn-export" onclick="exportCSV()">📥 匯出 CSV</button>
    <button class="btn btn-export" onclick="exportJSON()">📥 匯出 JSON</button>
    <button class="btn btn-reset" onclick="resetAll()">🗑️ 重設全部</button>
  </div>
  <div class="last-saved" id="lastSaved"></div>
</div>

<script>
const STUDENTS = [
  { id:"11591027", name:"許愷云",  method:"個案", title:"桃園市某公立國小轉型雙語教育實施現況之個案研究" },
  { id:"11491046", name:"林雋堯",  method:"個案", title:"價值共創觀點探討利害關係人協作——以國內半導體產業漢民科技為例" },
  { id:"11491047", name:"曲庭葦",  method:"SPSS", title:"護理人員工作壓力與離職意圖關係中工作滿意度及組織承諾之序列中介效果探討" },
  { id:"11591002", name:"江雨臻",  method:"SPSS", title:"探討血液透析護理師其工作壓力、情緒勞動與工作滿意度之相關性" },
  { id:"11591003", name:"李芷萱",  method:"個案", title:"探討動態競合張力管理如何促成價值共創：以台灣A-Team為例" },
  { id:"11591006", name:"徐莉佳",  method:"個案", title:"台灣農產品行銷個案研究（行銷個案）" },
  { id:"11591009", name:"陳雅芬",  method:"個案", title:"臺灣妖怪村商業模式之個案硏究" },
  { id:"11591016", name:"李郁瑾",  method:"個案", title:"以價值共創觀點探討企業永續商業模式" },
  { id:"11591019", name:"張倍瑜",  method:"個案", title:"國泰人壽整合行銷傳播個案研究" },
  { id:"11591020", name:"黃婕雯",  method:"個案", title:"ESG趨勢下企業策略性人力資源管理之挑戰與回應" },
  { id:"11591021", name:"陳韋蒨",  method:"SPSS", title:"關係品質在企業社會責任與運動消費意圖之中介效果" },
  { id:"11591023", name:"李榆媃",  method:"SPSS", title:"澎湖縣國民小學教師組織政治知覺、工作滿足與組織承諾關係之研究" },
  { id:"11591026", name:"呂鈺玫",  method:"德爾菲", title:"數位行銷執行策略關鍵成功因素之研究" },
  { id:"11591028", name:"楊紓函",  method:"德爾菲", title:"國民運動中心智慧化趨勢之關鍵因素研究" },
  { id:"11591029", name:"陳柔蓉",  method:"德爾菲", title:"以德菲法建構中西醫居家照護模式" },
  { id:"11591030", name:"邱翊寧",  method:"AHP", title:"運用德爾菲法及層級分析法建構夜市攤商觀點下之夜市品質特性" },
  { id:"11591032", name:"薛宇皓",  method:"AHP", title:"以層級分析法建立醫藥物流業者評選準則——以Y製藥公司為例" },
  { id:"11591045", name:"盧宥蓁",  method:"AHP", title:"影響消費者購買電競筆電產品之關鍵因素——使用AHP方法為例" },
  { id:"11591046", name:"蘇韋勳",  method:"AHP", title:"AHP層級分析法應用於資訊專案團隊效能評估之研究" },
];
const FIELDS = ["ch1","ch2","ch3","ch4","ch5","midterm","final"];
const FIELD_LABELS = { ch1:"第1章", ch2:"第2章", ch3:"第3章", ch4:"第4章", ch5:"第5章", midterm:"期中", final:"期末" };
const STORAGE_KEY = "thesis_review_115_1";

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (d && d.data) return d;
  } catch(e) {}
  return { data: {}, savedAt: null };
}
function save(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ data, savedAt: new Date().toISOString() }));
  document.getElementById("lastSaved").textContent = "最後儲存：" + new Date().toLocaleString("zh-TW");
}
function getVal(sid, field) {
  return !!load().data[sid]?.[field];
}
function toggle(sid, field) {
  const d = load().data;
  if (!d[sid]) d[sid] = {};
  d[sid][field] = !d[sid][field];
  save(d);
  render();
}

function calcProgress(sid) {
  const d = load().data[sid] || {};
  let n = 0, t = FIELDS.length;
  FIELDS.forEach(f => { if (d[f]) n++; });
  return Math.round(n / t * 100);
}
function statusLabel(pct) {
  if (pct === 100) return `<span class="status-badge status-done">✓ 完成</span>`;
  if (pct > 0) return `<span class="status-badge status-partial">◐ ${pct}%</span>`;
  return `<span class="status-badge status-none">✗ 未開始</span>`;
}

function render() {
  const tbody = document.getElementById("tableBody");
  const filter = document.querySelector(".filter-btn.active")?.dataset.filter || "all";
  let html = "";
  let totalPerField = {};
  FIELDS.forEach(f => totalPerField[f] = 0);
  let completedCount = 0;

  STUDENTS.forEach((s, i) => {
    const pct = calcProgress(s.id);
    if (pct === 100) completedCount++;
    FIELDS.forEach(f => { if (getVal(s.id, f)) totalPerField[f]++; });

    // filter
    if (filter === "pending" && pct >= 100) return;
    if (filter !== "all" && filter !== "pending" && s.method !== filter) return;

    html += `<tr data-method="${s.method}" data-pct="${pct}">
      <td>${i+1}</td>
      <td class="id-cell">${s.id}</td>
      <td class="name-cell"><strong>${s.name}</strong></td>
      <td class="title-cell" title="${s.title}">${s.title}</td>
      <td class="method-cell"><span class="method-tag method-${s.method}">${s.method}</span></td>`;

    FIELDS.forEach(f => {
      const v = getVal(s.id, f);
      html += `<td><input type="checkbox" class="chk" ${v ? "checked" : ""} onchange="toggle('${s.id}','${f}')"></td>`;
    });

    html += `<td class="status-cell">${statusLabel(pct)}</td></tr>`;
  });
  tbody.innerHTML = html;

  // footer totals
  const footRow = document.getElementById("footRow");
  let fhtml = `<td colspan="5" style="text-align:right;padding-right:10px;">總計（✓數）</td>`;
  FIELDS.forEach(f => {
    fhtml += `<td class="col-total">${totalPerField[f]}/${STUDENTS.length}</td>`;
  });
  fhtml += `<td>—</td>`;
  footRow.innerHTML = fhtml;

  // summary bar
  const totalDone = FIELDS.reduce((s, f) => s + totalPerField[f], 0);
  const totalMax = FIELDS.length * STUDENTS.length;
  const overallPct = Math.round(totalDone / totalMax * 100);
  document.getElementById("summaryBar").innerHTML = `
    <div class="summary-chip"><span class="dot dot-all"></span>總人數 ${STUDENTS.length}</div>
    <div class="summary-chip"><span class="dot dot-done"></span>全部完成 ${completedCount} 人</div>
    <div class="summary-chip"><span class="dot ${overallPct>=100?'dot-done':overallPct>=50?'dot-partial':'dot-none'}"></span>整體進度 ${overallPct}%</div>
    ${FIELDS.map(f => `<div class="summary-chip" title="${FIELD_LABELS[f]}">${FIELD_LABELS[f]} ${totalPerField[f]}/${STUDENTS.length}</div>`).join("")}
  `;
}

function exportCSV() {
  let csv = "\uFEFF"; // BOM for Excel
  csv += "序號,學號,姓名,研究方法,論文題目,第1章,第2章,第3章,第4章,第5章,期中報告,期末報告,進度%}\n";
  STUDENTS.forEach((s, i) => {
    const d = load().data[s.id] || {};
    const pct = calcProgress(s.id);
    const row = FIELDS.map(f => d[f] ? "\u2713" : "");
    csv += `${i+1},${s.id},${s.name},${s.method},"${s.title}",${row.join(",")},${pct}%\n`;
  });
  download(csv, "論文進度審查表.csv", "text/csv;charset=utf-8");
}
function exportJSON() {
  const d = load();
  download(JSON.stringify(d, null, 2), "論文進度審查表.json", "application/json");
}
function download(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function resetAll() {
  if (!confirm("確定要重設所有勾選狀態嗎？此操作無法復原。")) return;
  localStorage.removeItem(STORAGE_KEY);
  render();
}

// filter buttons
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
});

render();
</script>
</body>
</html>
