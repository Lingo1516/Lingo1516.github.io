<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>論文進度審查表 | 115-1 研究方法</title>
  <style>
    :root {
      --bg: #FDF8E8;
      --card: #FFFDF2;
      --border: #F2EAD3;
      --accent: #D4A017;
      --accent-light: #F5E6A3;
      --text: #3D2C00;
      --text-light: #6B5A30;
      --green: #2E7D32;
      --green-light: #E8F5E9;
      --yellow: #F57F17;
    }
    
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      max-width: 100%;
    }
    
    h1 {
      text-align: center;
      color: var(--text);
      margin-bottom: 20px;
      font-size: 1.8rem;
    }
    
    .summary-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .summary-chip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 0.85rem;
    }
    
    .dot-done { color: var(--green); }
    .dot-partial { color: var(--yellow); }
    .dot-none { color: var(--text-light); }
    .dot-all { color: var(--text); }
    
    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      margin: 2px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    
    .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    
    th, td {
      padding: 8px 4px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    
    th {
      background: var(--card);
      font-weight: 600;
      min-width: 40px;
    }
    
    .sub {
      font-size: 0.75rem;
      color: var(--text-light);
    }
    
    .status-badge {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
    }
    
    .done { background: var(--green-light); color: var(--green); }
    .partial { background: #FFF3E0; color: var(--yellow); }
    .none { background: #E0E0E0; color: var(--text-light); }
    
    .date-row {
      display: none;
      align-items: center;
      gap: 8px;
    }
    
    .date-row.visible {
      display: flex;
    }
    
    .date-in {
      width: 100px;
      height: 30px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: white;
      font-size: 0.8rem;
    }
    
    .date-in.filled {
      background: var(--yellow-light, #FFF9C4);
    }
    
    .btn {
      display: inline-block;
      padding: 8px 16px;
      margin: 2px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    
    .btn-export {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    
    .btn-export:hover { background: var(--yellow); color: white; }
    
    .btn-reset {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    
    .btn-reset:hover { background: #ffe; color: var(--text); }
    
    .btn-logout {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    
    .btn-logout:hover { background: #ffe; color: var(--text); }
    
    @media (max-width: 600px) {
      .summary-bar { gap: 10px; }
      .summary-chip { padding: 6px 12px; font-size: 0.7rem; }
      th, td { padding: 6px 2px; }
    }
  </style>
</head>
<body>
  <h1>📋 論文進度審查表 | 115-1 研究方法</h1>
  
  <!-- 進度摘要 -->
  <div class="summary-bar" id="summaryBar"></div>
  
  <!-- 過濾按鈕 -->
  <div style="margin-bottom: 20px; justify-content: flex-start;">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="個案">個案研究</button>
    <button class="filter-btn" data-filter="SPSS">SPSS 分析</button>
    <button class="filter-btn" data-filter="德爾菲">德爾菲法</button>
    <button class="filter-btn" data-filter="AHP">AHP 層級分析</button>
    <button class="filter-btn" data-filter="pending">未完成</button>
    <button class="btn btn-export" onclick="exportCSV()">📥 匯出 CSV</button>
    <button class="btn btn-export" onclick="exportJSON()">📥 匯出 JSON</button>
    <button class="btn btn-reset" onclick="resetAll()">🗑️ 重設全部</button>
  </div>
  
  <!-- 表格 -->
  <table id="reviewTable">
    <thead>
      <tr>
        <th rowspan="2">#</th>
        <th rowspan="2">學號</th>
        <th rowspan="2">姓名</th>
        <th rowspan="2" style="min-width:200px">論文題目</th>
        <th rowspan="2">方法</th>
        <th colspan="5">論文章節</th>
        <th colspan="2">報告</th>
        <th rowspan="2">進度</th>
      </tr>
      <tr>
        <th class="sub">第1章</th>
        <th class="sub">第2章</th>
        <th class="sub">第3章</th>
        <th class="sub">第4章</th>
        <th class="sub">第5章</th>
        <th class="sub">期中</th>
        <th class="sub">期末</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
    <tfoot>
      <tr id="footRow" style="background:#FFF8E0;font-weight:700;"></tr>
    </tfoot>
  </table>
  
  <script>
    // ===== 組態 =====
    var STORAGE_KEY = "thesis_review_115_1_v2";
    var FIELDS = ["ch1","ch2","ch3","ch4","ch5","midterm","final"];
    var FIELD_LABELS = {ch1:"第1章",ch2:"第2章",ch3:"第3章",ch4:"第4章",ch5:"第5章",midterm:"期中",final:"期末"};
    var METHODS = ["個案","SPSS","德爾菲","AHP"];
    
    // ===== 學生名單 =====
    var STUDENTS = [
      { id:"11591027", name:"許愷云", method:"個案", title:"桃園市某公立國小轉型雙語教育實施現況之個案研究" },
      { id:"11491046", name:"林雋堯", method:"個案", title:"價值共創觀點探討利害關係人協作——以國內半導體產業漢民科技為例" },
      { id:"11491047", name:"曲庭葦", method:"SPSS", title:"護理人員工作壓力與離職意圖關係中工作滿意度及組織承諾之序列中介效果探討" },
      { id:"11591002", name:"江雨臻", method:"SPSS", title:"探討血液透析護理師其工作壓力、情緒勞動與工作滿意度之相關性" },
      { id:"11591003", name:"李芷萱", method:"個案", title:"探討動態競合張力管理如何促成價值共創：以台灣A-Team為例" },
      { id:"11591006", name:"徐莉佳", method:"個案", title:"台灣農產品行銷個案研究（行銷個案）" },
      { id:"11591009", name:"陳雅芬", method:"個案", title:"臺灣妖怪村商業模式之個案硏究" },
      { id:"11591016", name:"李郁瑾", method:"個案", title:"以價值共創觀點探討企業永續商業模式" },
      { id:"11591019", name:"張倍瑜", method:"個案", title:"國泰人壽整合行銷傳播個案研究" },
      { id:"11591020", name:"黃婕雯", method:"個案", title:"ESG趨勢下企業策略性人力資源管理之挑戰與回應" },
      { id:"11591021", name:"陳韋蒨", method:"SPSS", title:"關係品質在企業社會責任與運動消費意圖之中介效果" },
      { id:"11591023", name:"李榆媃", method:"SPSS", title:"澎湖縣國民小學教師組織政治知覺、工作滿足與組織承諾關係之研究" },
      { id:"11591026", name:"呂鈺玫", method:"德爾菲", title:"數位行銷執行策略關鍵成功因素之研究" },
      { id:"11591028", name:"楊紓函", method:"德爾菲", title:"國民運動中心智慧化趨勢之關鍵因素研究" },
      { id:"11591029", name:"陳柔蓉", method:"德爾菲", title:"以德菲法建構中西醫居家照護模式" },
      { id:"11591030", name:"邱翊寧", method:"AHP", title:"運用德爾菲法及層級分析法建構夜市攤商觀點下之夜市品質特性" },
      { id:"11591032", name:"薛宇皓", method:"AHP", title:"以層級分析法建立醫藥物流業者評選準則——以Y製藥公司為例" },
      { id:"11591045", name:"盧宥蓁", method:"AHP", title:"影響消費者購買電競筆電產品之關鍵因素——使用AHP方法為例" },
      { id:"11591046", name:"蘇韋勳", method:"AHP", title:"AHP層級分析法應用於資訊專案團隊效能評估之研究" }
    ];
    
    // ===== localStorage 存取 =====
    function load(){
      try {
        var d = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (d && d.data) return d;
      } catch(e){}
      return {data:{}, savedAt:null};
    }
    
    function save(data){
      if (!data) data = {};
      localStorage.setItem(STORAGE_KEY, JSON.stringify({data:data, savedAt:new Date().toISOString()}));
      updateSummary();
    }
    
    // ===== 讀取單一學生資料 =====
    function getRec(sid){ return load().data[sid] || {}; }
    function getVal(sid, field){ return !!getRec(sid)[field]; }
    function getDate(sid, field){ return getRec(sid)[\"date_\" + field] || ""; }
    
    // ===== 進度計算 =====
    function calcProgress(sid){
      var r = getRec(sid), n = 0;
      FIELDS.forEach(function(f){ if (r[f]) n++; });
      return Math.round(n / FIELDS.length * 100);
    }
    function statusLabel(pct){
      if (pct === 100) return '<span class="status-badge done">✓ 完成</span>';
      if (pct > 0) return '<span class="status-badge partial">◐ ' + pct + '%</span>';
      return '<span class="status-badge none">✗ 未開始</span>';
    }
    
    // ===== 日期工具 =====
    function todaySt(){
      var t = new Date();
      var m = String(t.getMonth()+1).padStart(2,"0");
      var dd = String(t.getDate()).padStart(2,"0");
      return t.getFullYear() + "-" + m + "-" + dd;
    }
    
    // ===== 渲染單個欄位 =====
    function renderField(sid, field, dateVal){
      var label = FIELD_LABELS[field];
      var isSet = getVal(sid, field);
      var dateInp = '';
      
      if (isSet) {
        dateInp = '<div class="date-row visible">' +
          '<input type="date" class="date-in" value="' + dateVal + '" ' +
          'onchange="saveDate(this, \'' + sid + '\', \'' + field + '\')">' +
          '</div>';
      }
      
      var cbChecked = isSet ? 'checked' : '';
      
      return '<label style="display:flex;align-items:center;gap:6px;">' +
        '<input type="checkbox" class="chk" ' + cbChecked + ' ' +
        'onchange="toggleProgress(this, \'' + sid + '\', \'' + field + '\')">' +
        label +
        dateInp +
        '</label>';
    }
    
    // ===== 進度切換 =====
    function toggleProgress(cb, sid, field){
      var d = load().data;
      if (!d[sid]) d[sid] = {};
      d[sid][field] = !d[sid][field];
      
      // 如果勾選了但沒有日期，自動設為今天
      if (d[sid][field] && !d[sid]["date_" + field]) d[sid]["date_" + field] = todaySt();
      if (!d[sid][field]) d[sid]["date_" + field] = "";
      
      save(d);
      
      // 重新渲染該行
      var tr = cb.closest('tr');
      var html = '';
      FIELDS.forEach(function(f){
        var d = getDate(sid, f);
        html += renderField(sid, f, d);
      });
      tr.innerHTML = html + '<td>' + statusLabel(calcProgress(sid)) + '</td>';
      
      updateTotals();
    }
    
    // ===== 儲存日期 =====
    function saveDate(input, sid, field){
      var d = load().data;
      if (!d[sid]) d[sid] = {};
      d[sid]["date_" + field] = input.value || "";
      save(d);
      updateTotals();
    }
    
    // ===== 總計更新 =====
    function updateTotals(){
      var totalPerField = {};
      FIELDS.forEach(function(f){ totalPerField[f] = 0; });
      var completed = 0;
      
      STUDENTS.forEach(function(s){
        if (calcProgress(s.id) === 100) completed++;
        FIELDS.forEach(function(f){ if (getVal(s.id, f)) totalPerField[f]++; });
      });
      
      var fhtml = '<td colspan="5" style="text-align:right;padding-right:8px;">總計</td>';
      FIELDS.forEach(function(f){ fhtml += '<td class="col-total">' + totalPerField[f] + '/' + STUDENTS.length + '</td>'; });
      fhtml += '<td>—</td>';
      document.getElementById("footRow").innerHTML = fhtml;
      
      var done = 0;
      FIELDS.forEach(function(f){ done += totalPerField[f]; });
      var overall = Math.round(done / (FIELDS.length * STUDENTS.length) * 100);
      var cls = overall >= 100 ? "dot-done" : (overall >= 50 ? "dot-partial" : "dot-none");
      var chips = '<div class="summary-chip"><span class="dot dot-all"></span>總人數 ' + STUDENTS.length + '</div>';
      chips += '<div class="summary-chip"><span class="dot dot-done"></span>完成 ' + completed + ' 人</div>';
      chips += '<div class="summary-chip"><span class="dot ' + cls + '"></span>整體 ' + overall + '%</div>';
      document.getElementById("summaryBar").innerHTML = chips;
    }
    
    // ===== CSV 匯出 =====
    function exportCSV(){
      var data = {columns: [], rows: []};
      data.columns = ['#','學號','姓名','方法'].concat(FIELDS);
      
      STUDENTS.forEach(function(s){
        var row = [s.id, s.name, s.method];
        FIELDS.forEach(function(f){
          row.push(getVal(s.id, f) ? '是' : '否');
        });
        data.rows.push(row);
      });
      
      var csv = [data.columns.join(','), ...data.rows.map(r => r.join(','))].join('\n');
      var blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'thesis_progress_' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    }
    
    // ===== JSON 匯出 =====
    function exportJSON(){
      var data = load();
      var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json;charset=utf-8;'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'thesis_progress_' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }
    
    // ===== 重設全部 =====
    function resetAll(){
      if(confirm('確定要重設所有進度與日期嗎？')) {
        localStorage.removeItem(STORAGE_KEY);
        render();
      }
    }
    
    // ===== 渲染整個表格 =====
    function render(){
      var tbody = document.getElementById("tableBody");
      var activeBtn = document.querySelector(".filter-btn.active");
      var filter = activeBtn ? activeBtn.dataset.filter : "all";
      
      var html = "";
      
      STUDENTS.forEach(function(s, i){
        var pct = calcProgress(s.id);
        if (filter === "pending" && pct >= 100) return;
        if (filter !== "all" && filter !== "pending" && s.method !== filter) return;
        
        html += '<tr data-method="' + s.method + '" data-pct="' + pct + '" data-sid="' + s.id + '">';
        html += '<td>' + (i+1) + '</td>';
        html += '<td>' + s.name + '</td>';
        html += '<td title="' + s.title + '">' + (s.title.length > 30 ? s.title.substring(0,30) + "..." : s.title) + '</td>';
        html += '<td>' + s.method + '</td>';
        
        // 第1-5章 + 報告
        html += '<td>' + renderField(s.id, "ch1", getDate(s.id, "ch1")) + '</td>';
        html += '<td>' + renderField(s.id, "ch2", getDate(s.id, "ch2")) + '</td>';
        html += '<td>' + renderField(s.id, "ch3", getDate(s.id, "ch3")) + '</td>';
        html += '<td>' + renderField(s.id, "ch4", getDate(s.id, "ch4")) + '</td>';
        html += '<td>' + renderField(s.id, "ch5", getDate(s.id, "ch5")) + '</td>';
        html += '<td>' + renderField(s.id, "midterm", getDate(s.id, "midterm")) + '</td>';
        html += '<td>' + renderField(s.id, "final", getDate(s.id, "final")) + '</td>';
        
        html += '<td>' + statusLabel(pct) + '</td>';
        html += '</tr>';
      });
      
      tbody.innerHTML = html;
      updateTotals();
    }
    
    // ===== 初始化 =====
    document.querySelectorAll('.filter-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
        render();
      });
    });
    
    // 初始渲染
    render();
  </script>
</body>
</html>
