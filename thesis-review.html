<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>論文進度審查表 | 115-1 研究方法</title>
<style>
  :root{--bg:#FDF8E8;--card:#FFFDF2;--border:#F2EAD3;--accent:#D4A017;--accent-light:#F5E6A3;
        --text:#3D2C00;--text-light:#6B5A30;--green:#2E7D32;--green-light:#E8F5E9;
        --yellow:#F57F17;--yellow-light:#FFF8E1;--red:#C62828;--red-light:#FFEBEE;
        --blue:#1565C0;--blue-light:#E3F2FD;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  
  /* 標題列 */
  .header-bar{display:flex;justify-content:space-between;align-items:center;padding:20px;
              background:var(--card);border-bottom:2px solid var(--border);}
  h1{font-size:1.5rem;}
  .user-info{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--text-light);}
  
  /* 教師專用按鈕 */
  .btn-teacher{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;
               cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:600;}
  .btn-teacher:hover{background:#B8860B;}
  .btn-logout{padding:6px 14px;background:var(--card);border:1px solid var(--border);border-radius:6px;
              cursor:pointer;font-family:inherit;font-size:.85rem;color:var(--red);}
  
  /* 登入覆蓋層（預設隱藏，需要密碼時才顯示） */
  #loginOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;
                align-items:center;justify-content:center;z-index:1000;}
  .login-box{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:40px;
             box-shadow:0 8px 32px rgba(0,0,0,.15);text-align:center;max-width:360px;width:90%;}
  .login-box h2{font-size:1.4rem;margin-bottom:12px;}
  .login-box p{color:var(--text-light);font-size:.85rem;margin-bottom:20px;line-height:1.6;}
  .login-box input{width:100%;padding:12px;border:2px solid var(--border);border-radius:8px;
                   font-size:1rem;margin-bottom:12px;font-family:inherit;}
  .login-box input:focus{outline:none;border-color:var(--accent);}
  .login-box button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;
                    border-radius:8px;font-size:1rem;cursor:pointer;font-family:inherit;font-weight:600;}
  .login-error{color:var(--red);font-size:.8rem;margin-top:10px;min-height:18px;}
  .login-hint{font-size:.7rem;color:var(--text-light);margin-top:14px;opacity:.7;}
  
  /* 主要內容區 */
  #mainContent{display:none;}
  .container{max-width:1400px;margin:0 auto;padding:20px;}
  
  /* 摘要列 */
  .summary-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;}
  .summary-chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;
                font-size:.8rem;display:flex;align-items:center;gap:5px;}
  .summary-chip .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .dot-all{background:var(--accent);}.dot-done{background:var(--green);}
  .dot-partial{background:var(--yellow);}.dot-none{background:var(--red);}
  
  /* 篩選列 */
  .filter-bar{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
  .filter-btn{padding:5px 14px;border:1px solid var(--border);border-radius:16px;background:var(--card);
              cursor:pointer;font-size:.8rem;font-family:inherit;color:var(--text-light);}
  .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .filter-btn:hover:not(.active){background:var(--accent-light);}
  
  /* 表格 */
  .table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);
              border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:1100px;}
  thead th{background:var(--accent);color:#fff;padding:8px 4px;text-align:center;position:sticky;top:0;
           z-index:2;white-space:nowrap;border-right:1px solid rgba(255,255,255,.2);}
  thead th.sub{font-size:.7rem;background:#C49000;padding:4px 3px;}
  tbody tr:hover{background:#FFF9E6;}
  tbody tr:nth-child(even){background:#FFFEF8;}
  tbody tr:nth-child(even):hover{background:#FFF9E6;}
  td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--border);vertical-align:middle;}
  td.name-cell{text-align:left;padding-left:10px;white-space:nowrap;min-width:80px;}
  td.id-cell{color:var(--text-light);font-size:.7rem;white-space:nowrap;min-width:60px;}
  td.title-cell{text-align:left;padding-left:6px;font-size:.72rem;color:var(--text-light);
                max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .method-tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:.68rem;font-weight:600;}
  .method-個案{background:#E3F2FD;color:#1565C0;}
  .method-SPSS{background:#F3E5F5;color:#7B1FA2;}
  .method-德爾菲{background:#E8F5E9;color:#2E7D32;}
  .method-AHP{background:#FFF8E1;color:#E65100;}
  
  /* 檢查格（編輯模式） */
  .check-cell-edit{min-width:88px;padding:4px 2px;}
  .chk{width:18px;height:18px;cursor:pointer;accent-color:var(--accent);display:block;margin:0 auto 3px;}
  .date-in{width:82px;font-size:.65rem;font-family:inherit;border:1px solid var(--border);border-radius:4px;
           padding:1px 2px;text-align:center;background:#fff;color:var(--text-light);}
  .date-in:focus{outline:none;border-color:var(--accent);background:#FFFDF2;}
  .date-in.filled{border-color:var(--green);color:var(--green);font-weight:600;background:#F4FBF4;}
  .date-in:disabled{background:#f5f5f5;cursor:not-allowed;}
  
  /* 檢查格（查看模式） */
  .check-cell-view{min-width:76px;padding:4px 2px;font-size:.72rem;font-weight:500;}
  .check-status{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:600;}
  .status-done{background:var(--green-light);color:var(--green);}
  .status-partial{background:var(--yellow-light);color:var(--yellow);}
  .status-none{background:var(--red-light);color:var(--red);}
  
  td.status-cell{font-size:.72rem;font-weight:600;white-space:nowrap;min-width:50px;}
  .status-badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:.68rem;font-weight:700;}
  .status-badge.done{background:var(--green-light);color:var(--green);}
  .status-badge.partial{background:var(--yellow-light);color:var(--yellow);}
  .status-badge.none{background:var(--red-light);color:var(--red);}
  .col-total{background:#C49000 !important;font-size:.68rem;min-width:32px;color:#fff;}
  
  .legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:.78rem;color:var(--text-light);}
  .legend-item{display:flex;align-items:center;gap:4px;}
  .controls{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .btn{padding:7px 18px;border:1px solid var(--border);border-radius:8px;background:var(--card);
       color:var(--text);cursor:pointer;font-size:.82rem;font-family:inherit;}
  .btn:hover{background:var(--accent-light);border-color:var(--accent);}
  .btn-reset{color:var(--red);}.btn-reset:hover{background:var(--red-light);border-color:var(--red);}
  .btn-export{color:var(--blue);}.btn-export:hover{background:var(--blue-light);border-color:var(--blue);}
  .last-saved{text-align:center;font-size:.72rem;color:var(--text-light);margin-top:8px;}
  .mode-badge{background:var(--accent-light);border:1px solid var(--accent);border-radius:20px;
              padding:4px 12px;font-size:.75rem;color:var(--text);display:inline-block;margin-left:10px;}
  @media(max-width:768px){.container{padding:10px;}h1{font-size:1.1rem;}table{font-size:.7rem;}}
</style>
</head>
<body>

<!-- 標題列 -->
<div class="header-bar">
  <div style="display:flex;align-items:center;gap:12px;">
    <h1>📋 論文進度審查表</h1>
    <span id="modeBadge" class="mode-badge" style="display:none;"></span>
  </div>
  <div class="user-info" id="userInfo">
    <!-- 動態填入：教師按鈕或登出按鈕 -->
  </div>
</div>

<!-- 登入覆蓋層 -->
<div id="loginOverlay">
  <div class="login-box">
    <h2>🔐 教師專用密碼</h2>
    <p>此區域僅限教師編輯<br>請輸入密碼進入</p>
    <input type="password" id="passwordInput" placeholder="請輸入密碼">
    <button onclick="checkPassword()">確認進入</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-hint">密碼請詢問授課教師</div>
  </div>
</div>

<!-- 主要內容區 -->
<div id="mainContent">
<div class="container">
  <div class="summary-bar" id="summaryBar"></div>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="個案">個案研究</button>
    <button class="filter-btn" data-filter="SPSS">SPSS 分析</button>
    <button class="filter-btn" data-filter="德爾菲">德爾菲法</button>
    <button class="filter-btn" data-filter="AHP">AHP 層級分析</button>
    <button class="filter-btn" data-filter="pending">未完成</button>
  </div>

  <div class="table-wrap">
    <table id="reviewTable">
      <thead>
        <tr>
          <th rowspan="2">#</th>
          <th rowspan="2">學號</th>
          <th rowspan="2">姓名</th>
          <th rowspan="2" style="min-width:200px">論文題目</th>
          <th rowspan="2">方法</th>
          <th colspan="5">論文章節</th>
          <th colspan="2">報告</th>
          <th rowspan="2">進度</th>
        </tr>
        <tr>
          <th class="sub">第1章</th>
          <th class="sub">第2章</th>
          <th class="sub">第3章</th>
          <th class="sub">第4章</th>
          <th class="sub">第5章</th>
          <th class="sub">期中</th>
          <th class="sub">期末</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
      <tfoot><tr id="footRow" style="background:#FFF8E0;font-weight:700;"></tr></tfoot>
    </table>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="status-badge done">✓ 完成</span> 五章＋期中＋期末皆勾</div>
    <div class="legend-item"><span class="status-badge partial">◐ 進行中</span> 部分完成</div>
    <div class="legend-item"><span class="status-badge none">✗ 未開始</span> 進度 0%</div>
  </div>

  <!-- 只有教師才能看到這些按鈕 -->
  <div class="controls" id="editControls" style="display:none;">
    <button class="btn btn-export" onclick="exportCSV()">📥 匯出 CSV</button>
    <button class="btn btn-export" onclick="exportJSON()">📥 匯出 JSON</button>
    <button class="btn btn-reset" onclick="resetAll()">🗑️ 重設全部</button>
  </div>
  <div class="last-saved" id="lastSaved"></div>
</div>
</div>

<script>
// 密碼以 base64 編碼存放（非明文）。換密碼：把 btoa('新密碼') 的結果貼進 atob()
var TEACHER_PW_B64 = "MmRqaWx4amw=";  // base64 of "2djilxjl"
var SESSION_KEY = "thesis_review_session";
var isTeacher = false;

// ===== 登入/登出 =====
function checkPassword(){
  var input = document.getElementById("passwordInput").value;
  if (input === atob(TEACHER_PW_B64)) {
    localStorage.setItem(SESSION_KEY, "teacher");
    isTeacher = true;
    document.getElementById("loginOverlay").style.display = "none";
    showMain();
  } else {
    document.getElementById("loginError").textContent = "密碼錯誤，請重試";
    document.getElementById("passwordInput").value = "";
    document.getElementById("passwordInput").focus();
  }
}

function logout(){
  localStorage.removeItem(SESSION_KEY);
  isTeacher = false;
  location.reload();
}

function showTeacherLogin(){
  document.getElementById("loginOverlay").style.display = "flex";
  document.getElementById("passwordInput").value = "";
  document.getElementById("loginError").textContent = "";
  document.getElementById("passwordInput").focus();
}

// ===== 資料存取 =====
var STORAGE_KEY = "thesis_review_115_1";
function load(){
  try {
    var d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (d && d.data) return d;
  } catch(e){}
  return {data:{}, savedAt:null};
}
function save(data){
  if (!data) data = {};
  localStorage.setItem(STORAGE_KEY, JSON.stringify({data:data, savedAt:new Date().toISOString()}));
  var el = document.getElementById("lastSaved");
  if (el) el.textContent = "最後儲存：" + new Date().toLocaleString("zh-TW");
}

// ===== 學生名單 =====
var STUDENTS = [
  { id:"11591027", name:"許愷云", method:"個案", title:"桃園市某公立國小轉型雙語教育實施現況之個案研究" },
  { id:"11491046", name:"林雋堯", method:"個案", title:"價值共創觀點探討利害關係人協作——以國內半導體產業漢民科技為例" },
  { id:"11491047", name:"曲庭葦", method:"SPSS", title:"護理人員工作壓力與離職意圖關係中工作滿意度及組織承諾之序列中介效果探討" },
  { id:"11591002", name:"江雨臻", method:"SPSS", title:"探討血液透析護理師其工作壓力、情緒勞動與工作滿意度之相關性" },
  { id:"11591003", name:"李芷萱", method:"個案", title:"探討動態競合張力管理如何促成價值共創：以台灣A-Team為例" },
  { id:"11591006", name:"徐莉佳", method:"個案", title:"台灣農產品行銷個案研究（行銷個案）" },
  { id:"11591009", name:"陳雅芬", method:"個案", title:"臺灣妖怪村商業模式之個案硏究" },
  { id:"11591016", name:"李郁瑾", method:"個案", title:"以價值共創觀點探討企業永續商業模式" },
  { id:"11591019", name:"張倍瑜", method:"個案", title:"國泰人壽整合行銷傳播個案研究" },
  { id:"11591020", name:"黃婕雯", method:"個案", title:"ESG趨勢下企業策略性人力資源管理之挑戰與回應" },
  { id:"11591021", name:"陳韋蒨", method:"SPSS", title:"關係品質在企業社會責任與運動消費意圖之中介效果" },
  { id:"11591023", name:"李榆媃", method:"SPSS", title:"澎湖縣國民小學教師組織政治知覺、工作滿足與組織承諾關係之研究" },
  { id:"11591026", name:"呂鈺玫", method:"德爾菲", title:"數位行銷執行策略關鍵成功因素之研究" },
  { id:"11591028", name:"楊紓函", method:"德爾菲", title:"國民運動中心智慧化趨勢之關鍵因素研究" },
  { id:"11591029", name:"陳柔蓉", method:"德爾菲", title:"以德菲法建構中西醫居家照護模式" },
  { id:"11591030", name:"邱翊寧", method:"AHP", title:"運用德爾菲法及層級分析法建構夜市攤商觀點下之夜市品質特性" },
  { id:"11591032", name:"薛宇皓", method:"AHP", title:"以層級分析法建立醫藥物流業者評選準則——以Y製藥公司為例" },
  { id:"11591045", name:"盧宥蓁", method:"AHP", title:"影響消費者購買電競筆電產品之關鍵因素——使用AHP方法為例" },
  { id:"11591046", name:"蘇韋勳", method:"AHP", title:"AHP層級分析法應用於資訊專案團隊效能評估之研究" }
];

var FIELDS = ["ch1","ch2","ch3","ch4","ch5","midterm","final"];
var FIELD_LABELS = {ch1:"第1章",ch2:"第2章",ch3:"第3章",ch4:"第4章",ch5:"第5章",midterm:"期中",final:"期末"};

function getRec(sid){ return load().data[sid] || {}; }
function getVal(sid, field){ return !!getRec(sid)[field]; }
function getDate(sid, field){ return getRec(sid)["date_" + field] || ""; }

// ===== 進度計算 =====
function calcProgress(sid){
  var r = getRec(sid), n = 0;
  FIELDS.forEach(function(f){ if (r[f]) n++; });
  return Math.round(n / FIELDS.length * 100);
}
function statusLabel(pct){
  if (pct === 100) return '<span class="status-badge done">✓ 完成</span>';
  if (pct > 0) return '<span class="status-badge partial">◐ ' + pct + '%</span>';
  return '<span class="status-badge none">✗ 未開始</span>';
}

// ===== 更新 UI =====
function updateTotals(){
  var totalPerField = {};
  FIELDS.forEach(function(f){ totalPerField[f] = 0; });
  var completed = 0;
  STUDENTS.forEach(function(s){
    if (calcProgress(s.id) === 100) completed++;
    FIELDS.forEach(function(f){ if (getVal(s.id, f)) totalPerField[f]++; });
  });

  var fhtml = '<td colspan="5" style="text-align:right;padding-right:8px;">總計</td>';
  FIELDS.forEach(function(f){ fhtml += '<td class="col-total">' + totalPerField[f] + '/' + STUDENTS.length + '</td>'; });
  fhtml += '<td>—</td>';
  document.getElementById("footRow").innerHTML = fhtml;

  var done = 0;
  FIELDS.forEach(function(f){ done += totalPerField[f]; });
  var overall = Math.round(done / (FIELDS.length * STUDENTS.length) * 100);
  var cls = overall >= 100 ? "dot-done" : (overall >= 50 ? "dot-partial" : "dot-none");
  var chips = '<div class="summary-chip"><span class="dot dot-all"></span>總人數 ' + STUDENTS.length + '</div>';
  chips += '<div class="summary-chip"><span class="dot dot-done"></span>完成 ' + completed + ' 人</div>';
  chips += '<div class="summary-chip"><span class="dot ' + cls + '"></span>整體 ' + overall + '%</div>';
  FIELDS.forEach(function(f){
    chips += '<div class="summary-chip">' + FIELD_LABELS[f] + ' ' + totalPerField[f] + '/' + STUDENTS.length + '</div>';
  });
  document.getElementById("summaryBar").innerHTML = chips;
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ===== 渲染表格 =====
function render(){
  var tbody = document.getElementById("tableBody");
  var activeBtn = document.querySelector(".filter-btn.active");
  var filter = activeBtn ? activeBtn.dataset.filter : "all";
  var html = "";

  STUDENTS.forEach(function(s, i){
    var pct = calcProgress(s.id);
    if (filter === "pending" && pct >= 100) return;
    if (filter !== "all" && filter !== "pending" && s.method !== filter) return;

    html += '<tr data-method="' + esc(s.method) + '" data-pct="' + pct + '" data-sid="' + esc(s.id) + '">';
    html += '<td>' + (i+1) + '</td>';
    html += '<td class="id-cell">' + esc(s.id) + '</td>';
    html += '<td class="name-cell"><strong>' + esc(s.name) + '</strong></td>';
    html += '<td class="title-cell" title="' + esc(s.title) + '">' + esc(s.title) + '</td>';
    html += '<td><span class="method-tag method-' + esc(s.method) + '">' + esc(s.method) + '</span></td>';

    FIELDS.forEach(function(f){
      var checked = getVal(s.id, f);
      var dv = getDate(s.id, f);
      
      if (isTeacher) {
        // 編輯模式：顯示 checkbox + date input
        html += '<td class="check-cell-edit">';
        html += '<input type="checkbox" class="chk" ' + (checked ? "checked" : "") + 
                ' onchange="toggle(\'' + s.id + '\',\'' + f + '\',this)">';
        html += '<input type="date" class="date-in' + (dv ? " filled" : "") + '" value="' + dv + '"' +
                (checked ? "" : " disabled") +
                ' onchange="setDate(\'' + s.id + '\',\'' + f + '\',this.value)">';
        html += '</td>';
      } else {
        // 查看模式：顯示文字狀態
        var statusText = checked ? (dv ? '✓ ' + dv : '✓ 完成') : (pct > 0 ? '◐ 進行中' : '✗ 未開始');
        var statusClass = checked ? 'status-done' : (pct > 0 ? 'status-partial' : 'status-none');
        html += '<td class="check-cell-view"><span class="check-status ' + statusClass + '">' + statusText + '</span></td>';
      }
    });

    html += '<td class="status-cell">' + statusLabel(pct) + '</td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;
  updateTotals();
}

// ===== 教師操作（只在編輯模式可用） =====
function toggle(sid, field, cb){
  var d = load().data;
  if (!d[sid]) d[sid] = {};
  d[sid][field] = !d[sid][field];
  if (d[sid][field] && !d[sid]["date_" + field]) d[sid]["date_" + field] = todayStr();
  if (!d[sid][field]) d[sid]["date_" + field] = "";
  save(d);
  
  var cell = cb.closest("td");
  var di = cell ? cell.querySelector(".date-in") : null;
  if (di) {
    di.value = d[sid]["date_" + field] || "";
    di.classList.toggle("filled", !!di.value);
    di.disabled = !d[sid][field];
    di.style.opacity = d[sid][field] ? "1" : ".4";
  }
  updateTotals();
}

function setDate(sid, field, val){
  var d = load().data;
  if (!d[sid]) d[sid] = {};
  d[sid]["date_" + field] = val;
  if (val) d[sid][field] = true;
  save(d);
  
  var tr = document.querySelector('#tableBody tr[data-sid="' + sid + '"]');
  if (tr) {
    var idx = FIELDS.indexOf(field);
    var boxes = tr.querySelectorAll(".chk");
    if (boxes[idx]) boxes[idx].checked = !!d[sid][field];
  }
  updateTotals();
}

function todayStr(){
  var t = new Date();
  var m = String(t.getMonth()+1).padStart(2,"0");
  var dd = String(t.getDate()).padStart(2,"0");
  return t.getFullYear() + "-" + m + "-" + dd;
}

// ===== 匯出 =====
function exportCSV(){
  var csv = "\\uFEFF序號,學號,姓名,研究方法,論文題目";
  FIELDS.forEach(function(f){ csv += "," + FIELD_LABELS[f] + "-完成," + FIELD_LABELS[f] + "-日期"; });
  csv += ",進度%\n";
  
  STUDENTS.forEach(function(s, i){
    csv += (i+1) + "," + s.id + "," + s.name + "," + s.method + ',"' + s.title.replace(/"/g,'""') + '"';
    FIELDS.forEach(function(f){
      csv += "," + (getVal(s.id, f) ? "V" : "") + "," + getDate(s.id, f);
    });
    csv += "," + calcProgress(s.id) + "%\n";
  });
  
  download(csv, "論文進度審查表.csv", "text/csv;charset=utf-8");
}

function exportJSON(){
  download(JSON.stringify(load(), null, 2), "論文進度審查表.json", "application/json");
}

function download(content, filename, mime){
  var blob = new Blob([content], {type: mime});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

function resetAll(){
  if (!confirm("確定要重設所有勾選與日期嗎？此操作無法復原。")) return;
  localStorage.removeItem(STORAGE_KEY);
  render();
}

// ===== 初始化 =====
function showMain(){
  document.getElementById("mainContent").style.display = "block";
  document.getElementById("loginOverlay").style.display = "none";
  
  // 設定使用者資訊列
  var userInfo = document.getElementById("userInfo");
  var badge = document.getElementById("modeBadge");
  var editControls = document.getElementById("editControls");
  
  if (isTeacher) {
    badge.textContent = "👨‍🏫 教師編輯模式";
    badge.style.display = "inline-block";
    userInfo.innerHTML = '<span>👤 教師專用</span> <button class="btn-logout" onclick="logout()">登出</button>';
    editControls.style.display = "flex";
  } else {
    badge.textContent = "👀 公開查看模式";
    badge.style.display = "inline-block";
    userInfo.innerHTML = '<button class="btn-teacher" onclick="showTeacherLogin()">教師登入</button>';
    editControls.style.display = "none";
  }
  
  render();
}

document.addEventListener("DOMContentLoaded", function(){
  // 密碼輸入框 Enter 鍵
  document.getElementById("passwordInput").addEventListener("keypress", function(e){
    if (e.key === "Enter") checkPassword();
  });
  
  // 檢查是否有教師權限
  var session = localStorage.getItem(SESSION_KEY);
  if (session === "teacher") {
    isTeacher = true;
    showMain();
  } else {
    // 預設直接顯示公開模式
    isTeacher = false;
    showMain();
  }
  
  // 篩選按鈕
  document.querySelectorAll(".filter-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".filter-btn").forEach(function(b){ b.classList.remove("active"); });
      this.classList.add("active");
      render();
    });
  });
});
</script>
