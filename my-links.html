<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans TC",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.container{max-width:480px;width:100%}
.avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;color:white;font-weight:600;box-shadow:0 4px 12px rgba(102,126,234,0.3)}

.card-header{padding:14px 20px;background:#fafafa;border-bottom:1px solid #f0f0f0;font-size:13px;font-weight:600;color:#86868b;text-transform:uppercase;letter-spacing:0.5px}
.card a{display:flex;align-items:center;padding:16px 20px;color:#1d1d1f;text-decoration:none;border-bottom:1px solid #f5f5f7;transition:background 0.2s}
.card a:last-child{border-bottom:none}
.card a:hover{background:#f9f9f9}
.card a .icon{font-size:20px;margin-right:12px;width:28px;text-align:center}
.card a .text{flex:1;font-size:16px;font-weight:500}
.card a .arrow{color:#c7c7cc;font-size:18px}
.footer{text-align:center;color:#86868b;font-size:12px;margin-top:24px}
</style>
</head>
