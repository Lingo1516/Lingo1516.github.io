<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>陳曼都 - 我的連結</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans TC",sans-serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:48px 20px}
.container{max-width:480px;width:100%}
.avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(102,126,234,.3)}
h1{font-size:24px;font-weight:700;text-align:center;margin-bottom:4px;letter-spacing:.5px}
.subtitle{color:#86868b;font-size:14px;text-align:center;margin-bottom:32px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px}
.card-header{padding:13px 20px;background:#fafafa;border-bottom:1px solid #f0f0f0;font-size:13px;font-weight:600;color:#86868b;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.card a{display:flex;align-items:center;padding:16px 20px;color:#1d1d1f;text-decoration:none;border-bottom:1px solid #f5f5f7;transition:background .2s,padding-left .2s}
.card a:last-child{border-bottom:none}
.card a:hover{background:#f5f7ff;padding-left:24px}
.card a .icon{font-size:19px;margin-right:14px;width:26px;text-align:center;flex-shrink:0}
.card a .text{flex:1;font-size:16px;font-weight:500}
.card a .desc{font-size:12px;color:#a1a1a6;margin-top:2px;font-weight:400}
.card a .arrow{color:#c7c7cc;font-size:18px;flex-shrink:0;margin-left:8px}
.footer{text-align:center;color:#a1a1a6;font-size:12px;margin-top:24px;line-height:1.9}
</style>
</head>
<body>
<div class="container">
  <div class="avatar">陳</div>
  <h1>陳曼都</h1>
  <p class="subtitle">常用連結快速入口</p>

  <div class="card">
    <div class="card-header">📚 課程平台</div>
    <a href="https://leadership-guide.vercel.app/upload.html">
      <span class="icon">📤</span>
      <span class="text">作業上傳<span class="desc">繳交作業用，需自設密碼</span></span>
      <span class="arrow">›</span>
    </a>
    <a href="https://leadership-guide.vercel.app/files.html">
      <span class="icon">📥</span>
      <span class="text">檔案下載<span class="desc">用密碼開啟已上傳檔案</span></span>
      <span class="arrow">›</span>
    </a>
    <a href="https://leadership-guide.vercel.app/upload.html">
      <span class="icon">📝</span>
      <span class="text">其他資料上傳<span class="desc">臨時檔案、補充資料</span></span>
      <span class="arrow">›</span>
    </a>
  </div>

  <p class="footer">最後更新：2026-11-01</p>
</div>
</body>
</html>
