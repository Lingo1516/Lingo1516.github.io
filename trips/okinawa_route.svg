<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Microsoft JhengHei, sans-serif">
  <rect width="700" height="480" fill="#f8fbff"/>
  
  <text x="350" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a5276">沖繩 5天4夜行程圖</text>
  <text x="350" y="48" text-anchor="middle" font-size="13" fill="#666">2026年11月9日～13日</text>
  
  <!-- Map background -->
  <rect x="40" y="65" width="620" height="360" rx="10" fill="#eef6fb" stroke="#b8d4e3"/>
  
  <!-- Road line (vertical) -->
  <line x1="350" y1="90" x2="350" y2="400" stroke="#3498db" stroke-width="3" stroke-dasharray="8,4"/>
  
  <!-- Location labels -->
  <text x="80" y="100" text-anchor="middle" font-size="12" fill="#e74c3c" font-weight="bold">那霸機場</text>
  <text x="80" y="200" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">那霸市區</text>
  <text x="80" y="350" text-anchor="middle" font-size="12" fill="#8e44ad" font-weight="bold">本部町</text>
  
  <!-- Day 1 - Naha -->
  <circle cx="350" cy="210" r="15" fill="#27ae60"/>
  <rect x="170" y="185" width="180" height="50" rx="6" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="260" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Day 1 - 11/9 一</text>
  <text x="260" y="222" text-anchor="middle" font-size="11" fill="#333">🏨 那霸大和飯店</text>
  
  <!-- Day 2 - To Shitendo -->
  <circle cx="350" cy="310" r="15" fill="#2980b9"/>
  <rect x="170" y="285" width="180" height="50" rx="6" fill="white" stroke="#2980b9" stroke-width="2"/>
  <text x="260" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">Day 2 - 11/10 二</text>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#333">🚗 美麗海 → 紫藤</text>
  
  <!-- Day 3 - Shitendo -->
  <circle cx="350" cy="390" r="15" fill="#8e44ad"/>
  <rect x="170" y="375" width="180" height="40" rx="6" fill="white" stroke="#8e44ad" stroke-width="2"/>
  <text x="260" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e44ad">Day 3 - 11/11 三</text>
  <text x="260" y="408" text-anchor="middle" font-size="11" fill="#333">🏨 沖繩紫藤</text>
  
  <!-- Return arrow Day 3 -->
  <path d="M 350 390 Q 400 350 350 310" stroke="#8e44ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Legend -->
  <rect x="420" y="90" width="240" height="180" rx="8" fill="white" stroke="#ccc"/>
  <text x="540" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">📋 住宿一覽</text>
  <text x="435" y="138" font-size="12" fill="#27ae60">🟢 Day 1：那霸大和</text>
  <text x="435" y="158" font-size="12" fill="#2980b9">🔵 Day 2：紫藤（北上）</text>
  <text x="435" y="178" font-size="12" fill="#8e44ad">🟣 Day 3：紫藤</text>
  <text x="435" y="198" font-size="12" fill="#e67e22">🟠 Day 4：日航（返回）</text>
  <text x="435" y="218" font-size="12" fill="#e74c3c">🔴 Day 5：機場</text>
  <text x="435" y="245" font-size="11" fill="#888">租車：Day 2～4</text>
  <text x="435" y="260" font-size="11" fill="#888">還車：Day 4 19:00</text>
  
  <!-- Bottom info -->
  <text x="350" y="455" text-anchor="middle" font-size="12" fill="#888">Day 4：美國村 + 古宇利島 | Day 5：10:00 checkout → 寄行李 → 逛街 → 19:00航班</text>
</svg>
