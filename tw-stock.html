<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股即時行情</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#F7F5F0;color:#2D2A26;line-height:1.6}
.header{background:#fff;border-bottom:1px solid #E8E4DF;padding:16px 20px;position:sticky;top:0;z-index:100}
.header h1{font-size:20px;font-weight:700;color:#1a1a1a;margin-bottom:10px}
.search-wrap{display:flex;gap:8px}
.search-wrap input{flex:1;padding:10px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:16px;outline:none;background:#FAFAF8}
.search-wrap input:focus{border-color:#4A90D9;background:#fff}
.search-wrap button{padding:10px 20px;background:#4A90D9;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap}
.search-wrap button:hover{background:#357ABD}
#suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:10px;margin-top:4px;max-height:240px;overflow-y:auto;display:none;box-shadow:0 4px 12px rgba(0,0,0,.1)}
#suggestions .item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}
#suggestions .item:hover{background:#EEF4FB}
#suggestions .item:last-child{border-bottom:none}
.s-code{font-weight:700;color:#4A90D9;font-size:14px}
.s-name{color:#555;font-size:14px}
.main{max-width:800px;margin:0 auto;padding:20px}
.loading{text-align:center;padding:60px;color:#888;font-size:16px}
.error{text-align:center;padding:40px;color:#c0392b;background:#FDF2F2;border-radius:12px;margin-top:12px}
.card{background:#fff;border-radius:14px;padding:24px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stock-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.stock-name{font-size:22px;font-weight:700}
.stock-code{font-size:15px;color:#888;margin-top:2px}
.stock-price{font-size:36px;font-weight:700}
.stock-change{font-size:16px;font-weight:600;margin-top:4px}
.up{color:#E74C3C}.down{color:#27AE60}.flat{color:#888}
.meta-row{display:flex;gap:24px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid #f0f0f0}
.meta-item{display:flex;flex-direction:column;gap:2px}
.meta-label{font-size:12px;color:#999}
.meta-value{font-size:15px;font-weight:600;color:#333}
.chart-title{font-size:14px;font-weight:600;color:#555;margin-bottom:12px}
canvas{width:100%!important;height:200px!important}
.daily-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.daily-table th{text-align:left;padding:8px 6px;color:#888;font-weight:500;border-bottom:2px solid #eee}
.daily-table td{padding:7px 6px;border-bottom:1px solid #f5f5f5}
.daily-table tr:hover{background:#fafafa}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.tag-up{background:#FDECEA;color:#c0392b}
.tag-down{background:#E8F8F0;color:#1e8449}
.tag-flat{background:#f5f5f5;color:#888}
.btn-group{display:flex;gap:6px;margin-bottom:12px}
.btn-group button{padding:5px 14px;border:1.5px solid #ddd;background:#fff;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500}
.btn-group button.active{background:#4A90D9;color:#fff;border-color:#4A90D9}
.recent{margin-top:24px}
.recent h3{font-size:14px;color:#888;margin-bottom:10px;font-weight:500}
.recent-item{display:inline-block;padding:6px 12px;background:#fff;border-radius:8px;margin:3px;font-size:14px;cursor:pointer;border:1px solid #eee}
.recent-item:hover{border-color:#4A90D9;background:#EEF4FB}
.info-box{background:#EEF4FB;border-radius:10px;padding:14px 16px;font-size:13px;color:#555;line-height:1.8}
.info-box strong{color:#333}
</style>
</head>
<body>

<div class="header">
  <h1>📈 台股即時行情</h1>
  <div style="position:relative">
    <div class="search-wrap">
      <input id="searchInput" placeholder="輸入股票代號或名稱，如：台積電、2330、鴻海" autocomplete="off">
      <button onclick="doSearch()">查詢</button>
    </div>
    <div id="suggestions"></div>
  </div>
</div>

<div class="main" id="main">
  <div class="info-box">
    <strong>快速測試：</strong>輸入 <code>2330</code>（台積電）或 <code>鴻海</code>，或點擊下方常見股票 →
  </div>
  <div class="recent" style="margin-top:12px">
    <span class="recent-item" onclick="queryStock('2330')">2330 台積電</span>
    <span class="recent-item" onclick="queryStock('鸿海')">鸿海</span>
    <span class="recent-item" onclick="queryStock('2317')">2317 聯發科</span>
    <span class="recent-item" onclick="queryStock('3481')">3481 緯創</span>
    <span class="recent-item" onclick="queryStock('6415')">6415 群創</span>
    <span class="recent-item" onclick="queryStock('5347')">5347 世界</span>
    <span class="recent-item" onclick="queryStock('0050')">0050 元大台灣50</span>
  </div>
</div>

<script>
let twList = null;
let currentCode = null;
let chartCtx = null;

// 載入股東名冊
async function loadStockList() {
  try {
    const resp = await fetch('tw-list.json');
    if (resp.ok) {
      twList = await resp.json();
      console.log('載入股票清單：', twList._tse + twList._otc, '檔');
    }
  } catch(e) {
    console.log('tw-list.json 載入失敗，使用 fallback');
  }
}
loadStockList();

const searchInput = document.getElementById('searchInput');
const suggestions = document.getElementById('suggestions');

searchInput.addEventListener('input', debounce(() => {
  const v = searchInput.value.trim();
  if (v.length < 1) { suggestions.style.display = 'none'; return; }
  if (/^\d+$/.test(v)) { suggestions.style.display = 'none'; return; }
  showSuggestions(v);
}, 260));

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) suggestions.style.display = 'none';
});

function showSuggestions(q) {
  if (!twList) { suggestions.style.display = 'none'; return; }
  const qLow = q.toLowerCase();
  const matches = twList.rows.filter(r =>
    r.n.includes(q) || r.c.includes(q) || r.f.includes(q)
  ).slice(0, 8);
  if (!matches.length) { suggestions.style.display = 'none'; return; }
  suggestions.innerHTML = matches.map(r => `
    <div class="item" onclick="queryStock('${r.c}')">
      <span class="s-code">${r.c}</span>
      <span class="s-name">${r.n}</span>
    </div>
  `).join('');
  suggestions.style.display = 'block';
}

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

async function queryStock(code) {
  suggestions.style.display = 'none';
  searchInput.value = code;
  currentCode = code;
  showLoading();
  const data = await fetchQuote(code);
  if (data) renderQuote(data);
  else showError('查無此股票或暫無資料');
}

async function doSearch() {
  const v = searchInput.value.trim();
  if (!v) return;
  // 先嘗試純代號
  if (/^\d+$/.test(v)) {
    await queryStock(v);
    return;
  }
  // 名稱搜尋
  if (twList) {
    const matches = twList.rows.filter(r => r.n.includes(v) || r.f.includes(v));
    if (matches.length === 1) {
      await queryStock(matches[0].c);
      return;
    }
    if (matches.length > 1) {
      // 顯示候選
      showCandidates(matches);
      return;
    }
  }
  // fallback：嘗試直接把中文當代號查 MIS（不會成功，但試試看）
  await queryStock(v);
}

function showCandidates(rows) {
  const list = rows.map(r => `<span class="recent-item" onclick="queryStock('${r.c}')">${r.c} ${r.n}</span>`).join('');
  document.getElementById('main').innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:12px">找到多筆結果，請點選：</h3>
      <div>${list}</div>
    </div>`;
}

async function fetchQuote(code) {
  try {
    // MIS 即時報價
    const exCh = code.startsWith('00') || /^\d{5,6}$/.test(code) ? `otc_${code}.tw` : `tse_${code}.tw`;
    const resp = await fetch(`https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${encodeURIComponent(exCh)}`, {
      headers: { 'Referer': 'https://mis.twse.com.tw/stock/index.jsp' }
    });
    const text = (await resp.text()).replace(/^.*?\{/,'{').replace(/\}.*$/,'}');
    const j = JSON.parse(text);
    const msg = j.msgArray?.[0];
    if (!msg || !msg.z || msg.z === '-') {
      // 可能是上櫃
      const otcCode = code.startsWith('00') ? `tse_${code}.tw` : `otc_${code}.tw`;
      const resp2 = await fetch(`https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${encodeURIComponent(otcCode)}`, {
        headers: { 'Referer': 'https://mis.twse.com.tw/stock/index.jsp' }
      });
      const text2 = (await resp2.text()).replace(/^.*?\{/,'{').replace(/\}.*$/,'}');
      const j2 = JSON.parse(text2);
      if (j2.msgArray?.[0]?.z && j2.msgArray[0].z !== '-') return buildData(j2.msgArray[0], 'otc');
      return null;
    }
    return buildData(msg, msg.ex === 'OTC' ? 'otc' : 'tse');
  } catch(e) {
    console.error('fetchQuote error:', e);
    return null;
  }
}

function buildData(msg, market) {
  return {
    code: msg.c || msg.errCode,
    name: msg.n,
    price: parseFloat(msg.z) || 0,
    prevClose: parseFloat(msg.y) || 0,
    open: parseFloat(msg.o) || 0,
    high: parseFloat(msg.h) || 0,
    low: parseFloat(msg.l) || 0,
    volume: parseInt((msg.v || '0').replace(/,/g,'')) || 0,
    amount: parseInt((msg.a || '0').replace(/,/g,'')) || 0,
    date: msg.d || '',
    time: msg.pct || '',
    market: market
  };
}

function showLoading() {
  document.getElementById('main').innerHTML = '<div class="loading">⏳ 查詢中...</div>';
}

function showError(msg) {
  document.getElementById('main').innerHTML = `<div class="error">${msg}</div>`;
}

function renderQuote(d) {
  const chg = d.price - d.prevClose;
  const pct = d.prevClose ? ((chg / d.prevClose) * 100).toFixed(2) : '0.00';
  const cls = chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat';
  const sign = chg > 0 ? '+' : '';

  document.getElementById('main').innerHTML = `
    <div class="card">
      <div class="stock-header">
        <div>
          <div class="stock-name">${d.name}</div>
          <div class="stock-code">${d.code} · ${d.market === 'otc' ? '上櫃' : '上市'}</div>
        </div>
        <div style="text-align:right">
          <div class="stock-price ${cls}">${d.price.toLocaleString()}</div>
          <div class="stock-change ${cls}">${sign}${chg.toFixed(2)} (${sign}${pct}%)</div>
          <div style="font-size:12px;color:#999;margin-top:4px">${d.date} ${d.time}</div>
        </div>
      </div>
      <div class="meta-row">
        <div class="meta-item"><span class="meta-label">開盤</span><span class="meta-value">${d.open.toLocaleString()}</span></div>
        <div class="meta-item"><span class="meta-label">最高</span><span class="meta-value up">${d.high.toLocaleString()}</span></div>
        <div class="meta-item"><span class="meta-label">最低</span><span class="meta-value down">${d.low.toLocaleString()}</span></div>
        <div class="meta-item"><span class="meta-label">昨收</span><span class="meta-value">${d.prevClose.toLocaleString()}</span></div>
        <div class="meta-item"><span class="meta-label">成交股數</span><span class="meta-value">${(d.volume/10000).toFixed(1)} 千股</span></div>
        <div class="meta-item"><span class="meta-label">成交金額</span><span class="meta-value">${(d.amount/100000000).toFixed(2)} 億</span></div>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
        <div class="chart-title">📊 最近 30 日走勢</div>
        <div class="btn-group">
          <button onclick="loadKline(${d.code},'1m')" class="active" id="btn1m">1月</button>
          <button onclick="loadKline(${d.code},'3m')" id="btn3m">3月</button>
          <button onclick="loadKline(${d.code},'6m')" id="btn6m">6月</button>
        </div>
      </div>
      <canvas id="klineChart"></canvas>
    </div>
    <div class="card">
      <div class="chart-title">📋 最近交易日明細</div>
      <div id="dailyTable"></div>
    </div>
    <div style="text-align:center;padding:16px;font-size:12px;color:#bbb">
      資料來源：證交所 TWSE / 櫃買中心 TPEx · 僅供參考，不構成投資建議
    </div>
  `;

  loadKline(d.code, '1m');
}

async function loadKline(code, period) {
  // 更新按鈕狀態
  document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
  const btnId = 'btn' + period;
  const btn = document.getElementById(btnId);
  if (btn) btn.classList.add('active');

  const months = { '1m': 1, '3m': 3, '6m': 6 }[period] || 1;
  const now = new Date();
  let allData = [];

  for (let i = 0; i < months; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const dateStr = d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + '01';
    try {
      const resp = await fetch(`https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?date=${dateStr}&stockNo=${code}&response=json`);
      const j = await resp.json();
      if (j.stat === 'OK' && j.data) {
        allData = allData.concat(j.data);
      }
    } catch(e) {}
    await new Promise(r => setTimeout(r, 300)); // 避免 rate limit
  }

  // 排序取最新30筆
  allData.sort((a,b) => b[0].localeCompare(a[0]));
  const recent = allData.slice(0, 30);
  if (!recent.length) {
    document.getElementById('dailyTable').innerHTML = '<div style="padding:20px;text-align:center;color:#999">暫無資料</div>';
    return;
  }

  renderChart(recent);
  renderTable(recent);
}

function renderChart(data) {
  const canvas = document.getElementById('klineChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 200 * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = '200px';
  ctx.scale(dpr, dpr);

  const W = rect.width, H = 200;
  const padding = { top: 20, right: 60, bottom: 30, left: 10 };
  const chartW = W - padding.left - padding.right;
  const chartH = H - padding.top - padding.bottom;

  // 找極值
  let minP = Infinity, maxP = -Infinity;
  data.forEach(row => {
    const o = parseFloat(row[3])||0, h = parseFloat(row[4])||0, l = parseFloat(row[5])||0, c = parseFloat(row[6])||0;
    [h,l].forEach(v => { if(v>0){minP=Math.min(minP,v);maxP=Math.max(maxP,v)} });
    [o,c].forEach(v => { if(v>0){minP=Math.min(minP,v);maxP=Math.max(maxP,v)} });
  });
  const range = maxP - minP || 1;
  minP -= range * 0.05;
  maxP += range * 0.05;
  const rangeP = maxP - minP;

  const barW = chartW / data.length;

  ctx.clearRect(0, 0, W, H);

  // 網格
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padding.top + (chartH / 4) * i;
    ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(W - padding.right, y); ctx.stroke();
    const price = maxP - (rangeP / 4) * i;
    ctx.fillStyle = '#aaa'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(price.toFixed(0), W - padding.right + 4, y + 4);
  }

  // K線
  data.forEach((row, i) => {
    const date = row[0]; // "115/10/22"
    const o = parseFloat(row[3])||0, h = parseFloat(row[4])||0, l = parseFloat(row[5])||0, c = parseFloat(row[6])||0;
    const x = padding.left + barW * i + barW / 2;
    const yH = padding.top + ((maxP - h) / rangeP) * chartH;
    const yL = padding.top + ((maxP - l) / rangeP) * chartH;
    const yO = padding.top + ((maxP - o) / rangeP) * chartH;
    const yC = padding.top + ((maxP - c) / rangeP) * chartH;
    const isUp = c >= o;
    ctx.strokeStyle = isUp ? '#E74C3C' : '#27AE60';
    ctx.fillStyle = isUp ? '#E74C3C' : '#27AE60';
    // 上下影線
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, yH); ctx.lineTo(x, yL); ctx.stroke();
    // 實體
    const bodyTop = Math.min(yO, yC);
    const bodyH = Math.max(Math.abs(yO - yC), 1);
    ctx.fillRect(x - barW * 0.3, bodyTop, barW * 0.6, bodyH);
    // 日期標籤（每5個顯示一個）
    if (i % 5 === 0 || i === data.length - 1) {
      ctx.fillStyle = '#999'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(date.slice(4), x, H - 8);
    }
  });
}

function renderTable(data) {
  const el = document.getElementById('dailyTable');
  if (!el) return;
  const rows = data.slice().reverse(); // 由舊到新
  el.innerHTML = `
    <table class="daily-table">
      <thead><tr><th>日期</th><th>開盤</th><th>最高</th><th>最低</th><th>收盤</th><th>漲跌</th><th>成交股數</th></tr></thead>
      <tbody>
        ${rows.map(r => {
          const o=parseFloat(r[3])||0, h=parseFloat(r[4])||0, l=parseFloat(r[5])||0, c=parseFloat(r[6])||0;
          const diff = parseFloat(r[7])||0;
          const cls = diff > 0 ? 'tag-up' : diff < 0 ? 'tag-down' : 'tag-flat';
          const diffStr = diff > 0 ? '+'+diff : ''+diff;
          const vol = (parseInt((r[1]||'0').replace(/,/g,''))/10000).toFixed(0);
          return `<tr>
            <td>${r[0]}</td><td>${o.toLocaleString()}</td><td>${h.toLocaleString()}</td>
            <td>${l.toLocaleString()}</td><td><b>${c.toLocaleString()}</b></td>
            <td><span class="tag ${cls}">${diffStr}</span></td><td>${vol}千</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

// 預熱：載入清單
setTimeout(loadStockList, 1200);
</script>
</body>
</html>
