<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股指數即時查詢</title>
<style>
:root{--bg:#F7F5F0;--card:#fff;--text:#2D2A26;--muted:#6b6560;--accent:#B8860B;--up:#D64545;--down:#2F9E63;--border:#e8e4dc}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.6;padding:20px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:1.4rem;margin-bottom:4px}
.sub{font-size:.8rem;color:var(--muted);margin-bottom:18px}
.search-box{display:flex;gap:8px;margin-bottom:14px}
.search-box input{flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:1rem;background:var(--card);color:var(--text)}
.search-box input:focus{outline:none;border-color:var(--accent)}
.search-box button{padding:11px 22px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600}
.search-box button:hover{opacity:.9}
.search-box button:disabled{opacity:.5;cursor:wait}
.quick{margin-bottom:18px;font-size:.85rem;color:var(--muted);line-height:2}
.quick a{color:var(--accent);text-decoration:none;margin-right:10px;border-bottom:1px dashed var(--accent)}
.quick a:hover{opacity:.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card.wide{grid-column:1/-1}
.tag{display:inline-block;font-size:.7rem;font-weight:600;background:#f0ebe0;color:var(--muted);padding:2px 8px;border-radius:4px;margin-bottom:6px;letter-spacing:.05em}
.label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.big-num{font-size:2rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big-change{font-size:1rem;font-weight:600;margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.stat-item .val{font-size:.92rem;font-weight:600;font-variant-numeric:tabular-nums}
.status{font-size:.78rem;color:var(--muted);margin-top:10px}
.loading{color:var(--muted);font-style:italic;font-size:.9rem}
.error{color:var(--up);font-size:.9rem}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{margin-top:20px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:.74rem;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<h1>📊 台股指數即時查詢</h1>
<p class="sub">輸入股票代號查即時報價｜台灣股市慣例：紅漲綠跌</p>

<div class="search-box">
  <input type="text" id="stockInput" placeholder="輸入代號，如 2330、2317、0050" maxlength="6" autocomplete="off">
  <button id="btn" onclick="doQuery()">查詢</button>
</div>

<div class="quick">
  常用：<a href="#" onclick="doQuery('t00');return false;">加權指數</a><a href="#" onclick="doQuery('2330');return false;">台積電</a><a href="#" onclick="doQuery('2317');return false;">鴻海</a><a href="#" onclick="doQuery('2454');return false;">聯發科</a><a href="#" onclick="doQuery('0050');return false;">元大台灣50</a>
</div>

<div class="grid">
  <div class="card wide">
    <span class="tag">加權股價指數 TAIEX</span>
    <div id="marketContent"><p class="loading"><span class="spinner"></span>載入中...</p></div>
  </div>
</div>

<div class="grid" id="stockGrid" style="display:none;margin-top:14px">
  <div class="card wide" id="stockResult"></div>
</div>

<div class="footer">
  <b>資料來源：</b>台灣證券交易所 TWSE MIS（經 r.jina.ai 代理存取）· 涵蓋上市＋上櫃 · 非逐筆，延遲約 1–20 秒 · 僅供參考，不構成投資建議
</div>
</div>

<script>
const PROXY = 'https://r.jina.ai/';
const API = 'https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=';
const NAMES_API = 'https://mis.twse.com.tw/stock/api/getStockNames.jsp?n=';

function fmt(n, d=2){
  if(n===null||n===undefined||n===''||n==='-') return '-';
  const v = Number(n);
  if(isNaN(v)) return '-';
  return v.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function cls(v){ const n=parseFloat(v); return isNaN(n)?'':(n>0?'up':n<0?'down':''); }
function sign(v){ const n=parseFloat(v); return isNaN(n)?'':(n>0?'+':''); }

// 從 r.jina.ai 的 markdown 包裝中抽出 JSON
function extractJson(txt, marker){
  const i = txt.indexOf(marker);
  if(i < 0) return null;
  let j = txt.slice(i);
  const end = j.lastIndexOf('}');
  if(end > 0) j = j.slice(0, end+1);
  try { return JSON.parse(j); } catch(e) { return null; }
}

async function jinaGet(url, timeoutMs=20000){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), timeoutMs);
  try{
    const resp = await fetch(PROXY + url, {headers:{'Accept':'text/plain'}, signal:ctl.signal});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    return await resp.text();
  }catch(e){
    if(e.name==='AbortError') throw new Error('請求逾時（'+(timeoutMs/1000)+'秒），請重試');
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

// 用代號或名稱反查，取得 c(代號) 與 key 前綴(tse/otc)
async function lookupNames(q){
  const txt = await jinaGet(NAMES_API + encodeURIComponent(q) + '&lang=zh_tw');
  const d = extractJson(txt, '{"build"');
  if(!d || !d.datas || !d.datas.length) return [];
  return d.datas.map(x=>{
    const ex = (x.key||'').startsWith('otc_') ? 'otc' : 'tse';
    return {code:x.c, name:x.n, ex};
  });
}

// 一次抓上市+上櫃
async function fetchQuotes(codes){
  const exCh = codes.map(c=>'tse_'+c+'.tw').concat(codes.map(c=>'otc_'+c+'.tw')).join('|');
  const txt = await jinaGet(API + encodeURIComponent(exCh) + '&json=1&delay=0');
  const d = extractJson(txt, '{"msgArray"');
  if(!d || !d.msgArray) throw new Error('無法解析資料');
  // 過濾掉 c 為空或 z 為 '-' 的無效項目
  return d.msgArray.filter(m=>m.c && m.c!=='');
}

function renderQuote(m){
  const z = m.z && m.z!=='-' ? parseFloat(m.z) : null;
  const y = m.y && m.y!=='-' ? parseFloat(m.y) : null;
  const h = m.h && m.h!=='-' ? parseFloat(m.h) : null;
  const l = m.l && m.l!=='-' ? parseFloat(m.l) : null;
  const o = m.o && m.o!=='-' ? parseFloat(m.o) : null;
  const v = m.v && m.v!=='-' ? parseFloat(m.v) : null;

  if(z===null){
    return `<p class="error">目前無成交價（可能非交易時段或今日無成交）</p>
      <div class="stat-row">
        <div class="stat-item"><div class="label">昨收</div><div class="val">${fmt(y)}</div></div>
      </div>`;
  }
  const chg = y!==null ? z - y : null;
  const pct = (y && chg!==null) ? (chg/y*100) : null;
  const c = cls(chg);
  return `
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
      <span class="big-num ${c}">${fmt(z)}</span>
      <span class="big-change ${c}">${chg!==null?sign(chg)+fmt(chg):'-'} ${pct!==null?'（'+sign(pct)+fmt(pct)+'%）':''}</span>
    </div>
    <div class="stat-row">
      <div class="stat-item"><div class="label">開盤</div><div class="val">${fmt(o)}</div></div>
      <div class="stat-item"><div class="label">最高</div><div class="val">${fmt(h)}</div></div>
      <div class="stat-item"><div class="label">最低</div><div class="val">${fmt(l)}</div></div>
      <div class="stat-item"><div class="label">昨收</div><div class="val">${fmt(y)}</div></div>
      <div class="stat-item"><div class="label">成交量</div><div class="val">${v!==null?fmt(v,0):'-'}</div></div>
      <div class="stat-item"><div class="label">時間</div><div class="val">${m['%']||m.t||'-'}</div></div>
    </div>
    <div class="stat-row" style="margin-top:6px">
      <div class="stat-item"><div class="label">本益比</div><div class="val">${m.p&&m.p!=='0'?fmt(m.p):'-'}</div></div>
      <div class="stat-item"><div class="label">漲停</div><div class="val up">${m.u&&m.u!=='-'?fmt(m.u):'-'}</div></div>
      <div class="stat-item"><div class="label">跌停</div><div class="val down">${m.w&&m.w!=='-'?fmt(m.w):'-'}</div></div>
    </div>`;
}

async function initMarket(){
  const el = document.getElementById('marketContent');
  try{
    const arr = await fetchQuotes(['t00']);
    const m = arr[0];
    if(!m) throw new Error('查無指數');
    el.innerHTML = renderQuote(m) + `<div class="status">${m.n||'發行量加權股價指數'}　資料日：${m.d||'-'}</div>`;
  }catch(e){
    el.innerHTML = `<p class="error">載入失敗：${e.message}</p>`;
  }
}

async function doQuery(codeIn){
  const input = document.getElementById('stockInput');
  const btn = document.getElementById('btn');
  let q = (codeIn !== undefined ? String(codeIn) : input.value).trim();
  if(!q){ input.focus(); return; }
  input.value = q;

  const card = document.getElementById('stockResult');
  const grid = document.getElementById('stockGrid');
  grid.style.display = 'grid';
  card.innerHTML = `<p class="loading"><span class="spinner"></span>查詢中...</p>`;
  btn.disabled = true;
  card.scrollIntoView({behavior:'smooth',block:'nearest'});

  try{
    const isIndex = (q.toLowerCase()==='t00' || q==='0' || q==='加權指數');
    if(isIndex){
      const arr = await fetchQuotes(['t00']);
      const m = arr[0];
      if(!m) throw new Error('查無此指數');
      card.innerHTML = `<span class="tag">${m.n||'加權指數'}　T00</span>` + renderQuote(m)
        + `<div class="status">資料日：${m.d||'-'}</div>`;
      return;
    }

    // 純數字代號（4~6 碼）直接查報價，跳過名稱反查（名稱反查會回傳上千筆權證，需 4~5 秒）
    if(/^\d{4,6}$/.test(q)){
      const q2 = await fetchQuotes([q]);
      const m = q2.find(x=>x.c===q) || q2[0];
      if(m){
        card.innerHTML = `<div style="padding-bottom:14px">
          <span class="tag">${m.n||m.c}　${m.c}　${m.ex==='otc'?'上櫃':'上市'}</span>
          ${renderQuote(m)}
          <div class="status">資料日：${m.d||'-'}</div></div>`;
        return;
      }
      // 代號查無 → 落入名稱反查（可能是 5~6 碼權證或特殊代碼）
    }

    // 先反查代號/名稱（支援上市 tse 與上櫃 otc）
    const cands = await lookupNames(q);
    if(!cands.length){
      card.innerHTML = `<p class="error">查無「${q}」</p><p class="status">請確認股票代號或名稱是否正確</p>`;
      return;
    }
    // 排序：完全符合代號 > 代號為純數字且較短 > 名稱完全相符 > 其餘（權證等衍生商品排後）
    const qn = q.toUpperCase();
    cands.sort((a,b)=>{
      const sc = x => {
        let s = 0;
        if(String(x.code).toUpperCase() === qn) s -= 1000;
        if(/^\d{4,6}$/.test(x.code)) s -= 100;
        if(/^\d{4}$/.test(x.code)) s -= 50;
        if(x.name === q) s -= 500;
        return s;
      };
      return sc(a) - sc(b);
    });
    const codes = cands.slice(0,6).map(c=>c.code);
    const quotes = await fetchQuotes(codes);

    if(!quotes.length){
      card.innerHTML = `<p class="error">查無報價資料（${q}）</p><p class="status">可能為當日無成交或非交易商品</p>`;
      return;
    }

    const extra = cands.length > 6 ? `<p class="status">共 ${cands.length} 筆相符，僅顯示前 ${quotes.length} 筆（權證等衍生商品已後排）</p>` : '';
    card.innerHTML = quotes.map(m=>{
      const exLabel = m.ex==='otc' ? '上櫃' : '上市';
      return `<div style="padding-bottom:14px;margin-bottom:14px;border-bottom:1px dashed var(--border)">
        <span class="tag">${m.n||m.c||'-'}　${m.c||''}　${exLabel}</span>
        ${renderQuote(m)}
        <div class="status">${m.nf||''}　資料日：${m.d||'-'}</div>
      </div>`;
    }).join('') + extra;
  }catch(e){
    card.innerHTML = `<p class="error">查詢失敗：${e.message}</p><p class="status">請確認代號是否正確，或稍後再試</p>`;
  }finally{
    btn.disabled = false;
  }
}

document.getElementById('stockInput').addEventListener('keypress', e=>{
  if(e.key==='Enter') doQuery();
});
initMarket();
</script>
</body>
</html>
