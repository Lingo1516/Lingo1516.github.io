<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股指數即時查詢</title>
<style>
:root{--bg:#F7F5F0;--card:#fff;--text:#2D2A26;--muted:#6b6560;--accent:#B8860B;--up:#D64545;--down:#2F9E63;--border:#e8e4dc}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.6;padding:20px}
h1{font-size:1.4rem;margin-bottom:16px}
.search-box{display:flex;gap:8px;margin-bottom:20px;max-width:960px;margin-left:auto;margin-right:auto}
.search-box input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:1rem;background:var(--card)}
.search-box button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer}
.search-box button:hover{opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:960px;margin:0 auto}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card.wide{grid-column:1/-1}
.tag{display:inline-block;font-size:.7rem;font-weight:600;background:#f0ebe0;color:var(--muted);padding:2px 8px;border-radius:4px;margin-bottom:8px}
.label{font-size:.78rem;color:var(--muted)}
.big-num{font-size:1.8rem;font-weight:700;letter-spacing:-.02em}
.big-change{font-size:.95rem;font-weight:600;margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}
.stat-row{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
.stat-item .label{font-size:.75rem}
.stat-item .val{font-size:.88rem;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:12px}
th{text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase}
td{padding:8px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.status{font-size:.82rem;color:var(--muted);margin-top:8px}
.loading{color:var(--muted);font-style:italic}
.error{color:var(--up)}
.footer{max-width:960px;margin:24px auto 0;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:.75rem;color:var(--muted);line-height:1.7}
.result-card{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div style="max-width:960px;margin:0 auto">
<h1>📊 台股指數即時查詢</h1>

<div class="search-box">
  <input type="text" id="stockInput" placeholder="輸入股票代號（如 2330、3714）或選擇加權指數" maxlength="6">
  <button onclick="queryStock()">查詢</button>
</div>

<div id="quickLinks" style="margin-bottom:16px;font-size:.85rem;color:var(--muted)">
  快速查詢：
  <a href="#" onclick="doQuery('tse_t00.tw');return false;" style="color:var(--accent);margin-left:4px">加權指數</a>、
  <a href="#" onclick="doQuery('2330');return false;" style="color:var(--accent);margin-left:4px">台積電 (2330)</a>、
  <a href="#" onclick="doQuery('3714');return false;" style="color:var(--accent);margin-left:4px">聯發科 (3714)</a>、
  <a href="#" onclick="doQuery('2454');return false;" style="color:var(--accent);margin-left:4px">夏普 (2454)</a>
</div>

<div class="grid" id="resultArea">
  <div class="card wide" id="marketCard">
    <span class="tag">加權股價指數</span>
    <div id="marketContent">
      <p class="loading">正在載入市場行情...</p>
    </div>
  </div>
</div>

<div class="grid" id="stockGrid" style="display:none">
  <div class="card wide result-card" id="stockResult"></div>
</div>

<div class="footer">
  <b>資料來源：</b>證交所 TWSE API（含加權指數與個股即時報價）。台灣股市慣例：紅漲綠跌。<br>
  頁面載入時自動取得最新加權指數，查詢個股時即時取用。資料非逐筆報價，僅供參考。
</div>
</div>

<script>
const EX_CH_MAP = {
  'tse_t00.tw': '加權股價指數',
  'tse_t00': '加權股價指數'
};

function formatNum(n) {
  if (!n || n === '-') return '-';
  return Number(n).toLocaleString('zh-TW', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function getChangeClass(val) {
  const n = parseFloat(val);
  if (isNaN(n)) return '';
  return n > 0 ? 'up' : n < 0 ? 'down' : '';
}

function getChangePrefix(val) {
  const n = parseFloat(val);
  if (isNaN(n)) return '';
  return n > 0 ? '+' : '';
}

async function fetchStockInfo(exCh) {
  const resp = await fetch(`https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${encodeURIComponent(exCh)}`, {
    headers: { 'Referer': 'https://mis.twse.com.tw/stock/index.jsp' }
  });
  const raw = await resp.text();
  const d = JSON.parse(raw.trim());
  return d.msgArray[0];
}

async function initMarket() {
  try {
    const m = await fetchStockInfo('tse_t00.tw');
    const z = parseFloat(m.z) || 0;
    const y = parseFloat(m.y) || 0;
    const h = parseFloat(m.h) || 0;
    const l = parseFloat(m.l) || 0;
    const chg = z - y;
    const pct = y !== 0 ? ((chg / y) * 100).toFixed(2) : '0.00';
    const changeClass = getChangeClass(chg);
    const prefix = getChangePrefix(chg);
    
    document.getElementById('marketContent').innerHTML = `
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
        <span class="big-num">${formatNum(z)}</span>
        <span class="big-change ${changeClass}">${prefix}${formatNum(chg)}（${prefix}${pct}%）</span>
      </div>
      <div class="stat-row">
        <div class="stat-item"><div class="label">最高</div><div class="val">${formatNum(h)}</div></div>
        <div class="stat-item"><div class="label">最低</div><div class="val">${formatNum(l)}</div></div>
        <div class="stat-item"><div class="label">昨日收盤</div><div class="val">${formatNum(y)}</div></div>
        <div class="stat-item"><div class="label">資料時間</div><div class="val">${m['%'] || m.t || '-'}</div></div>
      </div>
      <div class="status">指數名稱：${m.n || '加權指數'}</div>
    `;
  } catch(e) {
    document.getElementById('marketContent').innerHTML = `<p class="error">載入失敗：${e.message}</p>`;
  }
}

async function doQuery(input) {
  const code = input.trim().toLowerCase();
  const inputEl = document.getElementById('stockInput');
  if (code) inputEl.value = code;
  
  let exCh, name;
  if (/^\d+$/.test(code) && code.length >= 4) {
    // Stock code
    exCh = `tse_${code}.tw`;
    name = code;
  } else if (code === 'tse_t00.tw' || code === 'tse_t00') {
    exCh = 'tse_t00.tw';
    name = '加權指數';
  } else {
    alert('請輸入 4 位數股票代號，或選擇上方快速連結');
    return;
  }
  
  const card = document.getElementById('stockResult');
  card.innerHTML = '<p class="loading">查詢中...</p>';
  document.getElementById('stockGrid').style.display = 'grid';
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  
  try {
    const m = await fetchStockInfo(exCh);
    const z = m.z && m.z !== '-' ? parseFloat(m.z) : null;
    const y = m.y && m.y !== '-' ? parseFloat(m.y) : null;
    const h = m.h && m.h !== '-' ? parseFloat(m.h) : null;
    const l = m.l && m.l !== '-' ? parseFloat(m.l) : null;
    const chg = (z && y) ? z - y : null;
    const pct = (z && y && y !== 0) ? ((chg / y) * 100).toFixed(2) : null;
    const changeClass = chg !== null ? getChangeClass(chg) : '';
    const prefix = chg !== null ? getChangePrefix(chg) : '';
    
    if (!z) {
      card.innerHTML = `<div class="card"><p class="error">暫無即時報價資料（${name}）</p><p class="status">可能為非交易時段或該代號不存在</p></div>`;
      return;
    }
    
    card.innerHTML = `
      <span class="tag">${name}</span>
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
        <span class="big-num">${formatNum(z)}</span>
        <span class="big-change ${changeClass}">${prefix}${formatNum(chg)}（${prefix}${pct}%）</span>
      </div>
      <div class="stat-row">
        <div class="stat-item"><div class="label">最高</div><div class="val">${h ? formatNum(h) : '-'}</div></div>
        <div class="stat-item"><div class="label">最低</div><div class="val">${l ? formatNum(l) : '-'}</div></div>
        <div class="stat-item"><div class="label">昨日收盤</div><div class="val">${y ? formatNum(y) : '-'}</div></div>
        <div class="stat-item"><div class="label">資料時間</div><div class="val">${m['%'] || m.t || '-'}</div></div>
      </div>
      <div class="status">指數/股票名稱：${m.n || '-'}</div>
    `;
  } catch(e) {
    card.innerHTML = `<div class="card"><p class="error">查詢失敗：${e.message}</p></div>`;
  }
}

// Handle Enter key
document.getElementById('stockInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') doQuery(this.value);
});

// Init on load
initMarket();
</script>
</body>
</html>
